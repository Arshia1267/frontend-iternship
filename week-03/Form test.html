<!DOCTYPE html>
<html>
    <head>
       <meta charset ="UTF-8">
       <title>Html Form</title>
    </head>
    <body>
        <form>
            <label for="name">نام</label>
            <input type="text" id="name" required>
            <br></br>
            <label for="email">ایمیل</label>
            <input type="email" id="email">
            <br></br>
            <label for="pas">رمز عبور</label>
            <input type="password" id="pas" required>
            <br></br>
            <label for="age">سن</label>
            <input type="number" id="age" min="1" max="100" required>
            <br></br>
            <input type="radio" id="male-radio" name="gender" required>
            <label for="male-radio">اقا</label>
            <input type ="radio" id ="famale-radio" name="gender">
            <label for="famail-radio">خانوم</label>
            <br></br>
            <label for="bri">تاریخ تولد</label>
            <input type="date" id="bri" >
            <br></br>
            <label for="tel">شماره تلفن</label>
            <input type="tel" id="tel" minlength="10" maxlength="11" required>
            <br></br>
            <input type="checkbox" id="OK" required>
            <label for="OK">قوانین را می پذیرم</label>
            <br></br>
            <button type="submit">ثبت اطلاعات</button>



        </form>
    </body>

</html>
